name: Build APK from Uploaded ZIP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File Automatically
        run: |
          if [ -f *.zip ]; then
            unzip -o *.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate Flutter App Directory
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "ROOT_DIR=." >> $GITHUB_ENV
          else
            DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
            echo "ROOT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Clean & Build APK
        run: |
          cd ${{ env.ROOT_DIR }}
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAMA77-APK
          path: "**/build/**/outputs/**/*.apk"
