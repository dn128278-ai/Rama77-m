name: Build Rama77 Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle & Build APK
        run: |
          # 1. Zip file kholein agar zip me project hai
          if [ -f *.zip ]; then
            unzip -o *.zip
          fi

          # 2. build.gradle ki location dhoondhein
          BUILD_GRADLE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_GRADLE_PATH" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
          echo "Project folder found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. Gradle Wrapper generate karein aur APK banayein
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAMA77-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
